[pytest]
# Pytest Configuration

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=src
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    --cov-fail-under=50

# Coverage options
[coverage:run]
source = src
omit =
    */tests/*
    */__pycache__/*
    */site-packages/*
    */venv/*
    */virtualenv/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

exclude_lines =
    # Standard exclusions
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
    @abc.abstractmethod
    
# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    phase1: Phase 1 tests (current implementation)
    phase2: Phase 2 tests (AMI foundation)
    phase3: Phase 3 tests (state estimation)
    phase4: Phase 4 tests (data source management)
    phase5: Phase 5 tests (co-simulation)

# Async support
asyncio_mode = auto
