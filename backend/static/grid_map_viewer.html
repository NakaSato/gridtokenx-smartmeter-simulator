<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thai Grid Map - GridTokenX Smart Meter Simulator</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Custom Styles -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            overflow: hidden;
        }
        
        #map {
            width: 100vw;
            height: 100vh;
        }
        
        /* Layer Control Panel */
        .layer-control {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            max-width: 250px;
        }
        
        .layer-control h3 {
            margin-bottom: 10px;
            font-size: 14px;
            color: #333;
            border-bottom: 2px solid #eee;
            padding-bottom: 5px;
        }
        
        .layer-item {
            display: flex;
            align-items: center;
            margin: 8px 0;
            cursor: pointer;
        }
        
        .layer-item input {
            margin-right: 8px;
        }
        
        .layer-item label {
            font-size: 13px;
            cursor: pointer;
        }
        
        .layer-color {
            width: 16px;
            height: 3px;
            margin-left: auto;
            border-radius: 2px;
        }
        
        /* Info Panel */
        .info-panel {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            max-width: 300px;
        }
        
        .info-panel h2 {
            font-size: 16px;
            margin-bottom: 10px;
            color: #333;
        }
        
        .info-item {
            display: flex;
            justify-content: space-between;
            margin: 5px 0;
            font-size: 13px;
        }
        
        .info-label {
            color: #666;
        }
        
        .info-value {
            font-weight: 600;
            color: #333;
        }
        
        /* Network Statistics */
        .stats-panel {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 1000;
            min-width: 200px;
        }
        
        .stats-panel h3 {
            font-size: 14px;
            margin-bottom: 10px;
            color: #333;
        }
        
        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            border-bottom: 1px solid #eee;
            font-size: 13px;
        }
        
        .stat-row:last-child {
            border-bottom: none;
        }
        
        /* Popup Styles */
        .leaflet-popup-content-wrapper {
            border-radius: 8px;
        }
        
        .popup-content {
            font-size: 13px;
        }
        
        .popup-title {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 8px;
            color: #333;
        }
        
        .popup-row {
            display: flex;
            justify-content: space-between;
            margin: 4px 0;
        }
        
        .popup-label {
            color: #666;
        }
        
        /* Load File Button */
        .load-file-btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            width: 100%;
            margin-bottom: 10px;
        }
        
        .load-file-btn:hover {
            background: #45a049;
        }
        
        /* Legend */
        .legend {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            position: fixed;
            bottom: 30px;
            left: 10px;
            z-index: 1000;
        }
        
        .legend h4 {
            font-size: 13px;
            margin-bottom: 10px;
            color: #333;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            margin: 5px 0;
            font-size: 12px;
        }
        
        .legend-color {
            width: 20px;
            height: 3px;
            margin-right: 8px;
            border-radius: 2px;
        }
        
        .legend-marker {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
            border: 2px solid white;
            box-shadow: 0 0 3px rgba(0,0,0,0.5);
        }
        
        /* File Input (hidden) */
        #fileInput {
            display: none;
        }
        
        /* Loading Indicator */
        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255,255,255,0.9);
            padding: 20px 30px;
            border-radius: 8px;
            box-shadow: 0 2px 16px rgba(0,0,0,0.3);
            z-index: 2000;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <!-- Map Container -->
    <div id="map"></div>
    
    <!-- Network Statistics Panel -->
    <div class="stats-panel" id="statsPanel">
        <h3>📊 Network Statistics</h3>
        <div class="stat-row">
            <span>Buses:</span>
            <span id="statBuses">-</span>
        </div>
        <div class="stat-row">
            <span>Lines:</span>
            <span id="statLines">-</span>
        </div>
        <div class="stat-row">
            <span>Transformers:</span>
            <span id="statTransformers">-</span>
        </div>
        <div class="stat-row">
            <span>MV Lines:</span>
            <span id="statMVLines">-</span>
        </div>
        <div class="stat-row">
            <span>LV Lines:</span>
            <span id="statLVLines">-</span>
        </div>
    </div>
    
    <!-- Layer Control Panel -->
    <div class="layer-control" style="position: fixed; bottom: 30px; right: 10px; z-index: 1000;">
        <h3>🗂️ Layers</h3>
        <div class="layer-item">
            <input type="checkbox" id="layerMV" checked>
            <label for="layerMV">MV Network (22 kV)</label>
            <div class="layer-color" style="background: #ff6600;"></div>
        </div>
        <div class="layer-item">
            <input type="checkbox" id="layerLV" checked>
            <label for="layerLV">LV Network (0.4 kV)</label>
            <div class="layer-color" style="background: #ffcc00;"></div>
        </div>
        <div class="layer-item">
            <input type="checkbox" id="layerSubstations" checked>
            <label for="layerSubstations">Substations</label>
            <div class="layer-color" style="background: #ff9933;"></div>
        </div>
        <div class="layer-item">
            <input type="checkbox" id="layerTransformers" checked>
            <label for="layerTransformers">Transformers</label>
            <div class="layer-color" style="background: #9933ff;"></div>
        </div>
    </div>
    
    <!-- Legend -->
    <div class="legend">
        <h4>Map Legend</h4>
        <div class="legend-item">
            <div class="legend-marker" style="background: #ff6600;"></div>
            <span>MV Substation (22 kV)</span>
        </div>
        <div class="legend-item">
            <div class="legend-marker" style="background: #ffcc00;"></div>
            <span>LV Bus (0.4 kV)</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #ff6600;"></div>
            <span>MV Line (22 kV)</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #ffcc00;"></div>
            <span>LV Line (0.4 kV)</span>
        </div>
        <div class="legend-item">
            <div class="legend-marker" style="background: #9933ff;"></div>
            <span>Transformer</span>
        </div>
    </div>
    
    <!-- Hidden File Input -->
    <input type="file" id="fileInput" accept=".geojson,.json">
    
    <!-- Loading Indicator -->
    <div class="loading" id="loading" style="display: none;">
        Loading network data...
    </div>
    
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Map Viewer Script -->
    <script>
        // Initialize map centered on Thailand
        const map = L.map('map').setView([13.7563, 100.5018], 12);
        
        // Add base tile layer (OpenStreetMap)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors',
            maxZoom: 19
        }).addTo(map);
        
        // Layer groups
        const layers = {
            mvLines: L.layerGroup().addTo(map),
            lvLines: L.layerGroup().addTo(map),
            substations: L.layerGroup().addTo(map),
            transformers: L.layerGroup().addTo(map)
        };
        
        // GeoJSON layer storage
        let geojsonLayer = null;
        
        // Style functions
        function getLineStyle(feature) {
            return {
                color: feature.properties.color || '#ff6600',
                weight: feature.properties.width || 3,
                opacity: 0.8
            };
        }
        
        function getMarkerStyle(feature) {
            const radius = feature.properties.radius || 6;
            const color = feature.properties.color || '#ff6600';
            
            return {
                radius: radius,
                fillColor: color,
                color: '#fff',
                weight: 2,
                opacity: 1,
                fillOpacity: 0.8
            };
        }
        
        // Popup content generator
        function createPopup(feature) {
            const props = feature.properties;
            let content = '<div class="popup-content">';
            
            if (props.name) {
                content += `<div class="popup-title">${props.name}</div>`;
            }
            
            if (props.type === 'line') {
                if (props.voltage_level_kv) {
                    content += `<div class="popup-row">
                        <span class="popup-label">Voltage:</span>
                        <span class="popup-value">${props.voltage_level_kv} kV</span>
                    </div>`;
                }
                if (props.length_km) {
                    content += `<div class="popup-row">
                        <span class="popup-label">Length:</span>
                        <span class="popup-value">${props.length_km.toFixed(2)} km</span>
                    </div>`;
                }
                if (props.std_type) {
                    content += `<div class="popup-row">
                        <span class="popup-label">Cable Type:</span>
                        <span class="popup-value">${props.std_type}</span>
                    </div>`;
                }
            } else if (props.type === 'substation' || props.type === 'bus') {
                if (props.voltage_level_kv) {
                    content += `<div class="popup-row">
                        <span class="popup-label">Voltage:</span>
                        <span class="popup-value">${props.voltage_level_kv} kV</span>
                    </div>`;
                }
                if (props.zone) {
                    content += `<div class="popup-row">
                        <span class="popup-label">Zone:</span>
                        <span class="popup-value">${props.zone}</span>
                    </div>`;
                }
            } else if (props.type === 'transformer') {
                if (props.sn_mva) {
                    content += `<div class="popup-row">
                        <span class="popup-label">Capacity:</span>
                        <span class="popup-value">${(props.sn_mva * 1000).toFixed(0)} kVA</span>
                    </div>`;
                }
                if (props.vn_hv_kv && props.vn_lv_kv) {
                    content += `<div class="popup-row">
                        <span class="popup-label">Voltage:</span>
                        <span class="popup-value">${props.vn_hv_kv}/${props.vn_lv_kv} kV</span>
                    </div>`;
                }
            }
            
            content += '</div>';
            return content;
        }
        
        // Load GeoJSON data
        function loadGeoJSON(data) {
            // Clear existing layers
            if (geojsonLayer) {
                map.removeLayer(geojsonLayer);
            }
            
            layers.mvLines.clearLayers();
            layers.lvLines.clearLayers();
            layers.substations.clearLayers();
            layers.transformers.clearLayers();
            
            // Process features
            let stats = {
                buses: 0,
                lines: 0,
                transformers: 0,
                mvLines: 0,
                lvLines: 0
            };
            
            data.features.forEach(feature => {
                const type = feature.properties.type;
                const layer = feature.properties.layer;
                
                if (type === 'line') {
                    stats.lines++;
                    if (layer === 'MV') {
                        stats.mvLines++;
                        const line = L.geoJSON(feature, {
                            style: getLineStyle
                        }).bindPopup(createPopup(feature));
                        layers.mvLines.addLayer(line);
                    } else {
                        stats.lvLines++;
                        const line = L.geoJSON(feature, {
                            style: getLineStyle
                        }).bindPopup(createPopup(feature));
                        layers.lvLines.addLayer(line);
                    }
                } else if (type === 'substation' || type === 'bus') {
                    stats.buses++;
                    const marker = L.circleMarker(feature.geometry.coordinates, {
                        ...getMarkerStyle(feature)
                    }).bindPopup(createPopup(feature));
                    layers.substations.addLayer(marker);
                } else if (type === 'transformer') {
                    stats.transformers++;
                    const marker = L.circleMarker(feature.geometry.coordinates, {
                        ...getMarkerStyle(feature)
                    }).bindPopup(createPopup(feature));
                    layers.transformers.addLayer(marker);
                }
            });
            
            // Update statistics
            document.getElementById('statBuses').textContent = stats.buses;
            document.getElementById('statLines').textContent = stats.lines;
            document.getElementById('statTransformers').textContent = stats.transformers;
            document.getElementById('statMVLines').textContent = stats.mvLines;
            document.getElementById('statLVLines').textContent = stats.lvLines;
            
            // Fit map to bounds
            const group = new L.FeatureGroup([
                layers.mvLines,
                layers.lvLines,
                layers.substations,
                layers.transformers
            ]);
            
            if (group.getLayers().length > 0) {
                map.fitBounds(group.getBounds(), { padding: [50, 50] });
            }
        }
        
        // Load from file
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            document.getElementById('loading').style.display = 'block';
            
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    loadGeoJSON(data);
                    document.getElementById('loading').style.display = 'none';
                } catch (err) {
                    alert('Error loading GeoJSON: ' + err.message);
                    document.getElementById('loading').style.display = 'none';
                }
            };
            reader.readAsText(file);
        });
        
        // Layer control checkboxes
        document.getElementById('layerMV').addEventListener('change', function(e) {
            if (e.target.checked) {
                map.addLayer(layers.mvLines);
            } else {
                map.removeLayer(layers.mvLines);
            }
        });
        
        document.getElementById('layerLV').addEventListener('change', function(e) {
            if (e.target.checked) {
                map.addLayer(layers.lvLines);
            } else {
                map.removeLayer(layers.lvLines);
            }
        });
        
        document.getElementById('layerSubstations').addEventListener('change', function(e) {
            if (e.target.checked) {
                map.addLayer(layers.substations);
            } else {
                map.removeLayer(layers.substations);
            }
        });
        
        document.getElementById('layerTransformers').addEventListener('change', function(e) {
            if (e.target.checked) {
                map.addLayer(layers.transformers);
            } else {
                map.removeLayer(layers.transformers);
            }
        });
        
        // Load sample data if available
        async function loadSampleData() {
            try {
                const response = await fetch('data/thai_network.geojson');
                if (response.ok) {
                    const data = await response.json();
                    loadGeoJSON(data);
                }
            } catch (err) {
                console.log('No sample data found. Load a GeoJSON file to visualize.');
            }
        }
        
        // Try to load sample data on startup
        loadSampleData();
        
        // Expose loadGeoJSON globally for programmatic loading
        window.loadThaiGridGeoJSON = loadGeoJSON;
    </script>
</body>
</html>
