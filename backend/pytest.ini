[pytest]
# =============================================================================
# Pytest Configuration for Smart Meter Simulator
# =============================================================================
# 
# Usage:
#   uv run pytest                    # Run all tests
#   uv run pytest -v                 # Verbose output
#   uv run pytest -x                 # Stop on first failure
#   uv run pytest --cov=src          # With coverage
#   uv run pytest --cov-report=html  # HTML coverage report
#   uv run pytest -m unit            # Run only unit tests
#   uv run pytest -m "not slow"      # Skip slow tests
# =============================================================================

# -----------------------------------------------------------------------------
# Test Discovery
# -----------------------------------------------------------------------------
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = tests

# -----------------------------------------------------------------------------
# Output & Reporting
# -----------------------------------------------------------------------------
addopts =
    -v
    --strict-markers
    --tb=short
    --color=yes
    --cov=src
    --cov-report=term-missing:skip-covered
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    --cov-fail-under=0
    --import-mode=importlib

# -----------------------------------------------------------------------------
# Coverage Configuration
# -----------------------------------------------------------------------------
[coverage:run]
source = src/smart_meter_simulator
omit =
    */tests/*
    */__pycache__/*
    */site-packages/*
    */venv/*
    */virtualenv/*
    */.venv/*
    */test*/*
    conftest.py
    tests/utils.py

[coverage:report]
precision = 2
show_missing = true
skip_covered = true
sort = cover
exclude_lines =
    # Standard exclusions
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    
    # Type checking
    if TYPE_CHECKING:
    @abstractmethod
    @abc.abstractmethod
    
    # Debug/development code
    logger.debug
    print\(
    pprint\(
    
    # Fallback imports
    except ImportError:
    
    # Protocol methods
    def __protocol__

[coverage:html]
directory = htmlcov
title = Smart Meter Simulator Coverage Report

[coverage:xml]
output = coverage.xml

# -----------------------------------------------------------------------------
# Test Markers
# -----------------------------------------------------------------------------
# Use markers to categorize tests:
#   @pytest.mark.unit          - Unit tests (fast, isolated)
#   @pytest.mark.integration   - Integration tests (multiple components)
#   @pytest.mark.slow          - Slow running tests (>1 second)
#   @pytest.mark.phase1        - Phase 1 tests (AMI Foundation)
#   @pytest.mark.phase2        - Phase 2 tests (Grid Integration)
#   @pytest.mark.phase3        - Phase 3 tests (State Estimation)
#   @pytest.mark.phase4        - Phase 4 tests (Data Management)
#   @pytest.mark.phase5        - Phase 5 tests (Co-Simulation)
#   @pytest.mark.vpp           - VPP-related tests
#   @pytest.mark.market        - Market-related tests
#   @pytest.mark.grid          - Grid topology tests
#   @pytest.mark.crypto        - Cryptography tests
# -----------------------------------------------------------------------------
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (multiple components)
    slow: Slow running tests (>1 second)
    phase1: Phase 1 tests (AMI Foundation)
    phase2: Phase 2 tests (Grid Integration)
    phase3: Phase 3 tests (State Estimation)
    phase4: Phase 4 tests (Data Management)
    phase5: Phase 5 tests (Co-Simulation)
    vpp: VPP-related tests
    market: Market-related tests
    grid: Grid topology tests
    crypto: Cryptography tests
    api: API endpoint tests
    e2e: End-to-end tests

# -----------------------------------------------------------------------------
# Async Configuration
# -----------------------------------------------------------------------------
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# -----------------------------------------------------------------------------
# Logging Configuration
# -----------------------------------------------------------------------------
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# -----------------------------------------------------------------------------
# Warnings Configuration
# -----------------------------------------------------------------------------
filterwarnings =
    # Ignore deprecation warnings from dependencies
    ignore::DeprecationWarning:pandapower.*
    ignore::DeprecationWarning:numpy.*
    ignore::PendingDeprecationWarning
    
    # Ignore specific runtime warnings
    ignore::RuntimeWarning:cvxpy.*
    ignore::UserWarning:influxdb_client.*

# -----------------------------------------------------------------------------
# Cache Configuration
# -----------------------------------------------------------------------------
cache_dir = .pytest_cache

# -----------------------------------------------------------------------------
# Timeout Configuration (requires pytest-timeout)
# -----------------------------------------------------------------------------
# timeout = 300  # 5 minutes default timeout
# timeout_method = thread  # or signal

# -----------------------------------------------------------------------------
# Parallel Execution (requires pytest-xdist)
# -----------------------------------------------------------------------------
# To run tests in parallel:
#   uv run pytest -n auto  # Auto-detect CPU count
#   uv run pytest -n 4     # Use 4 workers
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# Example Commands
# -----------------------------------------------------------------------------
# Run all tests:
#   uv run pytest
#
# Run with verbose output:
#   uv run pytest -v
#
# Run specific test file:
#   uv run pytest tests/test_api.py -v
#
# Run specific test class:
#   uv run pytest tests/test_api.py::TestHealthEndpoint -v
#
# Run specific test function:
#   uv run pytest tests/test_api.py::TestHealthEndpoint::test_health_check -v
#
# Run only unit tests:
#   uv run pytest -m unit
#
# Skip slow tests:
#   uv run pytest -m "not slow"
#
# Run with coverage (HTML report):
#   uv run pytest --cov=src --cov-report=html
#
# Run and stop on first failure:
#   uv run pytest -x
#
# Run and show local variables on failure:
#   uv run pytest -l
#
# Re-run failed tests only (requires pytest-rerunfailures):
#   uv run pytest --lf
#
# Run tests in parallel (requires pytest-xdist):
#   uv run pytest -n auto
# -----------------------------------------------------------------------------
