[package]
name = "gridtokenx_sim"
version = "0.1.0"
edition = "2021"

[lib]
name = "gridtokenx_sim"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.20", features = ["extension-module"] }
rand = "0.8"
rand_distr = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
libm = "0.2"

[features]
extension-module = ["pyo3/extension-module"]
default = ["extension-module"]
