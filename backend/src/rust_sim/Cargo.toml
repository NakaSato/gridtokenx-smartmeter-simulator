[package]
name = "gridtokenx_sim"
version = "0.1.0"
edition = "2021"

[lib]
name = "gridtokenx_sim"
crate-type = ["cdylib", "rlib"]

[dependencies]
# abi3-py311 builds a single stable-ABI wheel valid for the project's Python
# 3.11+ (and newer interpreters, e.g. 3.14), so the build no longer breaks when
# the host Python is ahead of PyO3's per-version support window.
pyo3 = { version = "0.28", features = ["extension-module", "abi3-py311"] }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
aes-gcm = "0.10"
crc32fast = "1.3"

[features]
extension-module = ["pyo3/extension-module"]
default = ["extension-module"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = 'abort'
strip = true
