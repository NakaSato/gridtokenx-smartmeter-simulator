[project]
name = "smart-meter-simulator"
version = "5.1.0"
description = "Smart Meter Simulator for P2P Energy Trading Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.120.1",
    "uvicorn>=0.24.0",
    "websockets>=12.0",
    "python-dotenv>=1.0.0",
    "cryptography>=41.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "aiohttp>=3.9.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "aiokafka>=0.11.0",
    "prometheus-client>=0.20.0",
    "greenlet>=3.0.0",
    "kafka-python>=2.0.2",
    "psycopg2-binary>=2.9.11",
    "influxdb_client>=1.18.0",
    "python-multipart>=0.0.22",
    "aiosqlite>=0.20.0",
    "opentelemetry-api>=1.30.0",
    "opentelemetry-sdk>=1.30.0",
    "opentelemetry-exporter-otlp>=1.30.0",
    "opentelemetry-instrumentation-fastapi>=0.51b0",
    "opentelemetry-instrumentation-logging>=0.51b0",
    "grpcio>=1.70.0",
    "betterproto[compiler]>=2.0.0b7",
    "aiomqtt>=2.5.1",
    "mapbox-vector-tile>=2.2.0",
    "requests>=2.32.5",
    "redis>=5.0.0",
    "base58>=2.1.1",
    "grpcio-tools>=1.80.0",
]


[project.optional-dependencies]
mosaik = ["mosaik>=3.3.0"]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "black>=25.1.0",
    "isort>=5.13.2,<6.0.0",
    "flake8>=7.3.0",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smart_meter_simulator"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.black]
line-length = 88
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 88

[project.scripts]
start = "smart_meter_simulator.app:main"
app = "smart_meter_simulator.app:main"
cli = "smart_meter_simulator.cli:main"

[tool.uv]
managed = true
