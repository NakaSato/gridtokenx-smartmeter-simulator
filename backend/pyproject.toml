[project]
name = "smart-meter-simulator"
version = "6.0.0"
description = "GLM-backed smart meter grid model simulator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.120.1",
    "uvicorn>=0.24.0",
    "websockets>=12.0",
    "python-dotenv>=1.0.0",
    "cryptography>=41.0.0",
    "base58>=2.1.1",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "prometheus-client>=0.20.0",
    "networkx>=3.6.1",
    "pvlib>=0.13.0",
    "matplotlib>=3.10.9",
    "pandapower>=3.3.3",
    "httpx>=0.28.1",
    "asyncpg>=0.30.0",
    "influxdb-client[async]>=1.40.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "black>=25.1.0",
    "isort>=5.13.2,<6.0.0",
    "flake8>=7.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smart_meter_simulator"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.black]
line-length = 88
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 88

[project.scripts]
start = "smart_meter_simulator.app:main"
app = "smart_meter_simulator.app:main"
cli = "smart_meter_simulator.cli:main"

[tool.uv]
managed = true
