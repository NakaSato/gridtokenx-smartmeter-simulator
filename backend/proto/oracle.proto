syntax = "proto3";

package gridtokenx.oracle.v1;

// Service for high-performance unified oracle ingestion (UTT)
service OracleService {
  // Unified Ingestion: Verified telemetry for both VPP operations (Path A) and Settlement (Path B)
  rpc Ingest (MeterReading) returns (IngestResponse);

  // Batch Ingestion: Optimized for high-throughput aggregators
  rpc IngestBatch (MeterReadingBatchRequest) returns (MeterReadingBatchResponse);

  // Bulk Raw Ingestion: Maximum performance endpoint for simulators (bypasses per-reading Protobuf overhead)
  rpc BulkRawIngest (BulkRawRequest) returns (BulkRawResponse);
}

// Packed binary frames from the simulator: [FrameLen(1b)] + [ProtocolV4Frame] + [Ed25519Signature(64b)]
message BulkRawRequest {
  bytes payload = 1;
  int32 meter_count = 2;
}

message BulkRawResponse {
  int32 processed_count = 1;
  string status = 2;
}

// Canonical Meter Reading with integrated security
message MeterReading {
  string reading_id = 1;
  string meter_id = 2;
  string meter_serial = 3;
  string user_id = 4;
  string wallet_address = 5;
  optional string zone_code = 6;
  
  // Energy metrics
  string kwh = 7;
  optional string energy_generated = 8;
  optional string energy_consumed = 9;
  
  // Operational metrics
  optional string voltage = 10;
  optional string current = 11;
  optional string battery_level = 12;
  optional string temperature = 13;
  
  int64 timestamp = 14; 
  bytes raw_payload = 15; // Raw binary payload (e.g. DLMS/COSEM encoded)
  optional string signature = 16; // Ed25519 hardware signature (Base58)
}

message IngestResponse {
  string receipt_id = 1;
  string status = 2;
}

message MeterReadingBatchRequest {
  repeated MeterReading readings = 1;
}

message MeterReadingBatchResponse {
  repeated string receipt_ids = 1;
  string status = 2;
  int32 accepted_count = 3;
  int32 rejected_count = 4;
}
