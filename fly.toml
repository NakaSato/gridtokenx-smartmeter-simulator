# Fly.io config for the GridTokenX smart-meter simulator backend.
#
# The backend is a stateful, continuously-ticking simulator: it keeps the grid
# model in memory and advances it every tick. So it must run as ONE always-on
# machine — never scale-to-zero, never multi-instance (each instance would hold
# its own divergent grid state).
#
# Deploy:
#   fly launch --no-deploy        # first time: claims an app name, writes [app]
#   fly deploy                    # build (root Dockerfile) + release
#
# After deploy, point the Vercel frontend at it:
#   SIMULATOR_URL = https://<app-name>.fly.dev

app = "gridtokenx-smartmeter-sim"   # change to your app name (or let `fly launch` set it)
primary_region = "sin"              # Singapore; pick the region nearest you

[build]
  dockerfile = "Dockerfile"         # root combined image; ENTRYPOINT = `uv run start`

[env]
  # app.py reads PORT (defaults 8082); pin it to the port Fly proxies to.
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  # Stateful sim — keep exactly one machine alive at all times.
  auto_stop_machines = false
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "10s"
    grace_period = "20s"
    method = "GET"
    path = "/api/v1/quality/health"

# pandapower + scipy + pvlib + matplotlib are memory-hungry; 2 GB headroom.
[[vm]]
  size = "shared-cpu-1x"
  memory = "2048mb"
