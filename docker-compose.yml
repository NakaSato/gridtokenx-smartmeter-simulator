version: '3.8'

services:
  smartmeter-simulator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gridtokenx-smartmeter-simulator
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - gridtokenx-network

networks:
  gridtokenx-network:
    driver: bridge
