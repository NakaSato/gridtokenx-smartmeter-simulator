[project]
name = "smart-meter-simulator"
version = "0.1.1"
description = "Smart Meter Simulator for GridTokenX"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "kafka-python>=2.0.2",
    "psycopg[binary]>=3.2.0",
    "python-dotenv>=1.0.0",
    "schedule>=1.2.0",
    "faker>=37.6.0",
    "numpy>=2.3.2",
    "pandas>=2.3.3",
    "websockets>=12.0",
    "influxdb-client>=1.18.0",
    "fastapi>=0.120.1",
    "aiohttp>=3.9.0",
    "cryptography>=41.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "jinja2>=3.1.0",
    "uvicorn>=0.24.0",
    "httpx>=0.25.0",
    "base58>=2.1.0",
    "aiofiles>=23.2.1",
    "pandapower>=3.3.0",
    "geopandas>=1.1.2",
    # Rust Hyper extension (optional, installed via maturin)
    # "smartmeter-hyper",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "black>=23.0.0", "isort>=5.12.0", "flake8>=6.0.0"]
rust = ["maturin>=1.4.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.black]
line-length = 88
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 88

[dependency-groups]
dev = ["black>=25.1.0", "flake8>=7.3.0", "isort>=6.0.1", "pytest>=8.4.2"]
