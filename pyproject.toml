[project]
name = "smart-meter-simulator"
version = "1.0.0"
description = "Smart Meter Simulator for P2P Energy Trading Platform"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.120.1",
    "uvicorn>=0.24.0",
    "websockets>=12.0",
    "python-dotenv>=1.0.0",
    "numpy>=2.3.2",
    "pandas>=2.3.3",
    "cryptography>=41.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "aiohttp>=3.9.0",
    "jinja2>=3.1.0",
    "faker>=37.6.0",
    "schedule>=1.2.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "aiokafka>=0.11.0",
    "prometheus-client>=0.20.0",
    "greenlet>=3.0.0",
    "pandapower>=2.14.0",
    "tables>=3.9.0",             # HDF5 support
    "pyarrow>=15.0.0",           # Parquet support
    "kafka-python>=2.0.2",
    "psycopg2-binary>=2.9.11",
    "influxdb-client>=1.18.0",
    "numba>=0.63.1",
]

[project.optional-dependencies]
mosaik = ["mosaik>=3.3.0"]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "black>=25.1.0",
    "isort>=6.0.1",
    "flake8>=7.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smart_meter_simulator"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.black]
line-length = 88
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 88

[project.scripts]
start-simulator = "smart_meter_simulator.app:main"

[tool.uv]
managed = true
