<!-- Charts Section -->
<div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
    <!-- Energy Flow Chart -->
    <div class="bg-slate-800/40 backdrop-blur-sm border border-slate-700/50 rounded-xl overflow-hidden">
        <div class="px-6 py-4 border-b border-slate-700/50 flex justify-between items-center">
            <h2 class="text-lg font-semibold text-white">Energy Flow Trends</h2>
            <button onclick="exportData()"
                class="flex items-center gap-1.5 text-blue-400 hover:text-blue-300 hover:bg-blue-500/10 px-2 py-1 rounded-lg transition-colors text-sm font-medium">
                <i data-lucide="download" class="h-4 w-4"></i> Export
            </button>
        </div>
        <div class="p-6">
            <div class="w-full h-[250px]">
                <canvas id="energyFlowChart"></canvas>
            </div>
        </div>
    </div>

    <!-- Market Price Chart -->
    <div class="bg-slate-800/40 backdrop-blur-sm border border-slate-700/50 rounded-xl overflow-hidden">
        <div class="px-6 py-4 border-b border-slate-700/50">
            <h2 class="text-lg font-semibold text-white">Market Price Trends</h2>
        </div>
        <div class="p-6">
            <div class="w-full h-[250px]">
                <canvas id="marketPriceChart"></canvas>
            </div>
        </div>
    </div>
</div>
