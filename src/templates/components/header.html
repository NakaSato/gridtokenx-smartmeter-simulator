<!-- Header -->
<header class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4 mb-8">
    <div class="flex items-center gap-3">
        <div>
            <h1 class="text-xl font-semibold tracking-tight">Smart Meter Simulator</h1>
        </div>
    </div>

    <!-- Controls -->
    <div class="flex flex-wrap items-center gap-3">
        <div
            class="flex items-center gap-2 bg-slate-800/50 backdrop-blur-sm rounded-xl p-1.5 border border-slate-700/50 shadow-sm">
            <button id="start-btn" onclick="startSimulation()"
                class="flex items-center gap-1.5 px-3 py-1.5 bg-emerald-500 hover:bg-emerald-600 text-white text-sm font-medium rounded-lg transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                <i data-lucide="play" class="h-3.5 w-3.5"></i> Start
            </button>
            <button id="stop-btn" onclick="stopSimulation()" disabled
                class="flex items-center gap-1.5 px-3 py-1.5 text-red-400 hover:text-red-300 hover:bg-red-500/10 text-sm font-medium rounded-lg transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                <i data-lucide="square" class="h-3.5 w-3.5"></i> Stop
            </button>
            <button id="pause-btn" onclick="pauseSimulation()" disabled
                class="flex items-center gap-1.5 px-3 py-1.5 text-slate-300 hover:text-white hover:bg-slate-700/50 text-sm font-medium rounded-lg transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                <i data-lucide="pause" class="h-3.5 w-3.5"></i> Pause
            </button>
            <button id="resume-btn" onclick="resumeSimulation()" disabled
                class="hidden flex items-center gap-1.5 px-3 py-1.5 text-emerald-400 hover:text-emerald-300 hover:bg-emerald-500/10 text-sm font-medium rounded-lg transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                <i data-lucide="play" class="h-3.5 w-3.5"></i> Resume
            </button>
            <a href="/maps"
                class="flex items-center gap-2 px-4 py-2 bg-slate-700 hover:bg-slate-600 text-white text-sm font-medium rounded-xl transition-all border border-slate-600">
                <i data-lucide="map" class="h-4 w-4"></i> Map View
            </a>
        </div>


        <div
            class="flex items-center gap-2 bg-slate-800/50 backdrop-blur-sm rounded-xl px-3 py-1.5 border border-slate-700/50 shadow-sm">
            <span class="text-sm text-slate-400">Meters</span>
            <input type="number" id="meter-count" value="20" min="1" max="1000"
                class="w-16 h-8 bg-slate-900/50 border border-slate-600 text-center text-sm rounded-lg focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all text-white">
            <button id="update-meters-btn" onclick="updateMeterCount()"
                class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-white text-xs font-medium rounded-lg transition-colors">
                Update
            </button>
        </div>

        <button onclick="openAddMeterModal()"
            class="flex items-center gap-2 px-4 py-2 bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 text-white text-sm font-medium rounded-xl shadow-lg shadow-orange-500/20 transition-all">
            <i data-lucide="plus" class="h-4 w-4"></i> Add Meter
        </button>
    </div>
</header>
