version: '3.8'

services:
  simulator:
    build:
      context: .
      dockerfile: Dockerfile.production
    image: gridtokenx/smartmeter-simulator:production
    container_name: smartmeter-simulator-prod
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      # Database
      DATABASE_URL: postgresql+asyncpg://gridtokenx:${DB_PASSWORD}@postgres:5432/gridtokenx
      GIS_DATABASE_URL: postgresql+asyncpg://gridtokenx:${DB_PASSWORD}@postgis:5433/gridtokenx_gis
      
      # InfluxDB
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN}
      INFLUXDB_ORG: gridtokenx
      INFLUXDB_BUCKET: meter_readings
      
      # Redis
      REDIS_URL: redis://redis:6379/0
      
      # AI Configuration
      AI_MODEL_PATH: /app/data/pea_lgbm_model.pkl
      AI_FORECAST_HORIZON: 24
      AI_CACHE_ENABLED: "true"
      AI_CACHE_TTL: 300
      AI_LOG_LEVEL: INFO
      AI_ENABLE_METRICS: "true"
      AI_MAX_CONCURRENT_FORECASTS: 20
      
      # Application
      LOG_LEVEL: INFO
      NUM_METERS: 55
      SIMULATION_INTERVAL: 15
      AUTOSTART_SIMULATION: "true"
      
      # OpenTelemetry
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      postgres:
        condition: service_healthy
      postgis:
        condition: service_healthy
      redis:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - gridtokenx
    volumes:
      - ./backend/data:/app/data:ro
      - simulator-logs:/app/logs
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '2'
          memory: 2G

  postgres:
    image: postgres:15-alpine
    container_name: postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: gridtokenx
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: gridtokenx
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gridtokenx"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gridtokenx

  postgis:
    image: postgis/postgis:15-3.3-alpine
    container_name: postgis-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: gridtokenx
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: gridtokenx_gis
    volumes:
      - postgis-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gridtokenx"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gridtokenx

  redis:
    image: redis:7-alpine
    container_name: redis-prod
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gridtokenx

  influxdb:
    image: influxdb:2.7-alpine
    container_name: influxdb-prod
    restart: unless-stopped
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: gridtokenx
      DOCKER_INFLUXDB_INIT_BUCKET: meter_readings
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN}
    volumes:
      - influxdb-data:/var/lib/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - gridtokenx

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector-prod
    restart: unless-stopped
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"  # OTLP gRPC
      - "4318:4318"  # OTLP HTTP
    networks:
      - gridtokenx

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus-prod
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - gridtokenx

  grafana:
    image: grafana/grafana:latest
    container_name: grafana-prod
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_INSTALL_PLUGINS: grafana-clock-panel
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - influxdb
    networks:
      - gridtokenx

networks:
  gridtokenx:
    driver: bridge

volumes:
  postgres-data:
  postgis-data:
  redis-data:
  influxdb-data:
  prometheus-data:
  grafana-data:
  simulator-logs:
