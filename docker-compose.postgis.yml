# PostGIS-only Docker Compose for Smart Meter Simulator
# Usage: docker compose -f docker-compose.postgis.yml up -d

services:
  postgis:
    image: nickblah/postgis:17-postgis-3.5
    container_name: simulator-postgis
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: gridtokenx_gis
      POSTGRES_USER: gridtokenx
      POSTGRES_PASSWORD: gridtokenx_password
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gridtokenx -d gridtokenx_gis"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  postgis_data:
